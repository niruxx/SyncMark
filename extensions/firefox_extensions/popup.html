<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SyncMark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>SyncMark <span id="provider-badge" class="provider-badge" hidden></span></h1>
      <button id="options-btn" class="icon-btn" title="Extension settings">⚙</button>
    </header>

    <section id="no-server-view" class="view" hidden>
      <p class="hint" id="no-server-text">No bookmark service is configured yet.</p>
      <button id="no-server-options-btn" class="primary-btn">Open extension settings</button>
    </section>

    <section id="lock-view" class="view" hidden>
      <p class="subtitle" id="lock-subtitle"></p>
      <form id="lock-form">
        <input type="text" id="lock-username" placeholder="Username" required autocomplete="username" />
        <input type="password" id="lock-password" placeholder="Password" required autocomplete="current-password" />
        <input type="password" id="lock-confirm" placeholder="Confirm password" hidden autocomplete="new-password" />
        <p class="error" id="lock-error" hidden></p>
        <button type="submit" id="lock-submit" class="primary-btn">Sign in</button>
      </form>
    </section>

    <section id="main-view" class="view" hidden>
      <button id="add-current-btn" class="primary-btn">☆ Bookmark this page</button>

      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Search…" />
        <select id="folder-select">
          <option value="">All folders</option>
        </select>
      </div>

      <ul id="bookmark-list"></ul>
      <p id="empty-state" class="hint" hidden>No bookmarks found.</p>

      <div class="footer-actions">
        <button id="add-btn" class="link-btn">+ Add bookmark manually</button>
        <button id="sign-out-btn" class="link-btn">Sign out</button>
      </div>
    </section>

    <section id="form-view" class="view" hidden>
      <h2 id="form-heading">Add bookmark</h2>
      <form id="bookmark-form">
        <label>
          Title
          <input type="text" id="form-title" required />
        </label>
        <label>
          URL
          <input type="url" id="form-url" required placeholder="https://example.com" />
        </label>
        <label id="form-folder-text-label">
          Folder
          <input type="text" id="form-folder-text" list="folder-datalist" placeholder="e.g. Work/Projects" />
          <datalist id="folder-datalist"></datalist>
        </label>
        <label id="form-folder-select-label" hidden>
          Folder
          <select id="form-folder-select">
            <option value="">— unfiled —</option>
          </select>
        </label>
        <label class="checkbox" id="form-favorite-label">
          <input type="checkbox" id="form-favorite" />
          Favorite
        </label>
        <p class="error" id="form-error" hidden></p>
        <div class="form-actions">
          <button type="button" id="form-cancel" class="secondary-btn">Cancel</button>
          <button type="submit" id="form-submit" class="primary-btn">Save</button>
        </div>
      </form>
    </section>
  </div>

  <script src="providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
