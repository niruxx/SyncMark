<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — SyncMark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div id="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <a class="brand" href="index.html">
          <span class="material-symbols-outlined brand-icon">bookmarks</span>
          <h1>SyncMark</h1>
        </a>
        <nav class="nav">
          <a href="index.html">Bookmarks</a>
          <a href="contacts.html">Contacts</a>
          <a href="calendar.html">Calendar</a>
          <a href="settings.html">Settings</a>
        </nav>
      </div>
      <div class="topbar-actions">
        <div class="account-menu">
          <button type="button" class="account-btn active" id="account-menu-trigger" aria-haspopup="true" aria-expanded="false">
            <span class="account-icon material-symbols-outlined">person</span>
            <span id="account-username">Account</span>
            <span class="material-symbols-outlined account-caret">expand_more</span>
          </button>
          <div class="account-dropdown" id="account-dropdown">
            <a href="account.html" class="account-dropdown-item">
              <span class="material-symbols-outlined">manage_accounts</span>
              Account settings
            </a>
            <button type="button" class="account-dropdown-item danger" id="account-sign-out-btn">
              <span class="material-symbols-outlined">logout</span>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <main class="content settings-page">
        <section class="settings-section">
          <h2>Profile picture</h2>
          <p class="settings-hint">Shown next to your name in the top bar. PNG, JPEG, GIF, or WebP — up to 2&nbsp;MB.</p>
          <div class="avatar-editor">
            <div class="avatar-preview" id="avatar-preview">
              <span class="material-symbols-outlined">person</span>
            </div>
            <div class="avatar-actions">
              <label class="button secondary" for="avatar-file">Upload picture</label>
              <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
              <button type="button" id="avatar-remove-btn" class="secondary" hidden>Remove</button>
            </div>
          </div>
          <p class="modal-error" id="avatar-error" hidden></p>
        </section>

        <section class="settings-section">
          <h2>Change username</h2>
          <form id="username-form" class="account-form">
            <label>
              New username
              <input type="text" id="new-username-input" required autocomplete="username" />
            </label>
            <label>
              Current password
              <input type="password" id="username-current-password" required autocomplete="current-password" />
            </label>
            <p class="modal-error" id="username-error" hidden></p>
            <button type="submit" class="button">Save username</button>
          </form>
        </section>

        <section class="settings-section">
          <h2>Change password</h2>
          <form id="password-form" class="account-form">
            <label>
              Current password
              <input type="password" id="password-current-input" required autocomplete="current-password" />
            </label>
            <label>
              New password
              <input type="password" id="password-new-input" required minlength="8" autocomplete="new-password" />
            </label>
            <label>
              Confirm new password
              <input type="password" id="password-confirm-input" required autocomplete="new-password" />
            </label>
            <p class="modal-error" id="password-error" hidden></p>
            <button type="submit" class="button">Save password</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="auth.js" data-next="account.js"></script>
</body>
</html>
